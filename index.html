<!--
  ============================================================
  90s GAME VARIANT A — "HIGH SCORE" : arcade attract screen.
  Links are the leaderboard. INSERT COIN blinks forever.
  EDIT ME: the LINKS array in the <script> at the bottom.
  ============================================================
-->

<style>
  :root{
    --bg:#000;
    --fg:#e8e8e8;
    --gold:#ffcc00;
    --red:#ff2222;
    --cyan:#00e5ff;
    --magenta:#ff3bd4;
  }
  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Press Start 2P',monospace;
    overflow-x:hidden;
  }

  /* CRT curvature glow + scanlines */
  body::after{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.3) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.85) 100%);
    z-index:9;
  }

  .screen{
    position:relative;
    z-index:1;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 12px 22px;
    text-align:center;
  }

  .credit-row{
    width:100%;
    display:flex;
    justify-content:space-between;
    font-size:9px;
    color:var(--cyan);
    margin-bottom:26px;
  }

  .name{
    font-family:'Nosifer',cursive;
    font-size:clamp(20px,6vw,34px);
    color:#e01212;
    text-shadow:
      2px 2px 0 #4a0000,
      4px 4px 0 #2a0000,
      6px 6px 0 #150000,
      0 0 34px rgba(255,20,20,0.75),
      0 0 70px rgba(255,0,0,0.35);
    transform:rotate(-2deg);
    filter:url(#roughen);
    will-change:filter;
    margin:10px 0 26px;
    line-height:1.2;
    position:relative;
    z-index:2;
  }




  /* blood dripping from the top of the screen */
  .drips{
    position:fixed;
    top:0; left:0; right:0;
    height:0;
    z-index:8;
    pointer-events:none;
  }
  .drips span{
    position:absolute;
    top:0;
    width:var(--w);
    left:var(--x);
    height:var(--h);
    background:linear-gradient(to bottom, #7a0000, #a80505 60%, #c40b0b);
    border-radius:0 0 50% 50%;
    box-shadow:0 0 12px rgba(150,0,0,0.5);
    animation:dripgrow 7s ease-in infinite;
    animation-delay:var(--d);
    transform-origin:top;
    will-change:transform;
  }
  .drips span::after{
    content:"";
    position:absolute;
    bottom:-6px; left:50%;
    width:8px; height:8px;
    margin-left:-4px;
    background:#c40b0b;
    border-radius:50%;
  }
  @keyframes dripgrow{
    0%{ transform:scaleY(0.55); }
    50%{ transform:scaleY(1); }
    100%{ transform:scaleY(0.55); }
  }

  /* red vignette pooling at the edges */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(120,0,0,0.28) 100%);
    z-index:7;
  }
  .subtitle{
    font-size:10px;
    color:var(--gold);
    letter-spacing:1px;
    margin-bottom:30px;
    animation:colorcycle 3s linear infinite;
  }
  @keyframes colorcycle{
    0%{ color:var(--gold); }
    33%{ color:var(--cyan); }
    66%{ color:var(--magenta); }
    100%{ color:var(--gold); }
  }

  .table-head{
    display:flex;
    width:100%;
    justify-content:space-between;
    font-size:8px;
    color:#ff4444;
    padding:0 10px 8px;
    border-bottom:2px solid #8a0000;
    margin-bottom:6px;
    text-shadow:0 0 8px rgba(255,0,0,0.4);
  }

  .links{
    list-style:none;
    margin:0; padding:0;
    width:100%;
  }
  .links a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:14px 10px;
    font-size:12px;
    color:var(--fg);
    text-decoration:none;
    letter-spacing:1px;
  }
  .links li:nth-child(1) a .rank{ color:var(--gold); }
  .links li:nth-child(2) a .rank{ color:#c0c0c0; }
  .links li:nth-child(3) a .rank{ color:#cd7f32; }
  .links a .rank{ width:34px; text-align:left; color:var(--fg); }
  .links a .score{ color:var(--gold); }
  .links a:hover{
    background:var(--red);
    color:#fff;
    animation:flash .4s steps(2) infinite;
  }
  .links a:hover .score,
  .links a:hover .rank{ color:#fff; }
  @keyframes flash{ 50%{ background:#900; } }

  a.nowplaying{
    display:block;
    margin-top:auto;
    padding-top:26px;
    font-size:10px;
    color:var(--gold);
    text-decoration:none;
    letter-spacing:1px;
    line-height:1.8;
    animation:blink 1.6s steps(1) infinite;
  }
  a.nowplaying:hover{
    color:#fff;
    animation:none;
    text-shadow:0 0 10px var(--gold);
  }
  @keyframes blink{ 50%{ opacity:.35; } }

  .press-start{
    margin-top:14px;
    font-size:8px;
    color:var(--cyan);
    letter-spacing:1px;
  }
  .press-start .count{
    display:inline-block;
    min-width:2ch;
    color:#e01212;
    font-size:13px;
    font-family:'Nosifer',cursive;
    text-shadow:0 0 12px rgba(255,20,20,0.8);
  }

  /* the whole screen jolts every few seconds like the cabinet got kicked */
  .screen{ animation:jolt 6s steps(1) infinite; }
  @keyframes jolt{
    0%{ transform:translate(0,0); }
    83%{ transform:translate(0,0); }
    84%{ transform:translate(-3px,2px) skewX(-1deg); }
    85%{ transform:translate(2px,-1px); }
    86%{ transform:translate(0,0); }
  }

  footer{
    margin-top:auto;
    padding-top:22px;
    font-size:7px;
    color:rgba(232,232,232,0.35);
    letter-spacing:1px;
  }
</style>

<style>
  /* ===== HAUNTED CABINET PACKAGE ===== */

  /* --- power-on: hide the game until the machine boots --- */
  body:not(.on) .screen,
  body:not(.on) .drips{ opacity:0; }
  .boot{
    position:fixed; inset:0;
    background:#000;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    color:#e8e8e8;
    letter-spacing:1px;
  }
  .boot{
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.35) 0 2px, transparent 2px 4px),
      #000;
  }
  .boot .term{
    font-family:'VT323',monospace;
    font-size:clamp(34px,9vw,58px);
    color:#c9ffd0;
    text-shadow:0 0 10px rgba(120,255,150,0.55), 0 0 40px rgba(80,255,120,0.25);
    letter-spacing:2px;
    display:flex;
    align-items:center;
  }
  .boot .cursor{
    display:inline-block;
    width:0.55em;
    height:1em;
    margin-left:6px;
    background:#c9ffd0;
    box-shadow:0 0 12px rgba(120,255,150,0.7);
    animation:blink 1s steps(1) infinite;
  }
  body.on .boot{ animation:crtflash .45s ease-out forwards; }
  @keyframes crtflash{
    0%{ opacity:1; background:#000; }
    15%{ background:#fff; opacity:1; transform:scaleY(1); }
    100%{ background:#fff; opacity:0; transform:scaleY(0.004); visibility:hidden; }
  }
  body.on .boot{ pointer-events:none; }

  /* leaderboard rows slam in after boot */
  .links li{ opacity:0; }
  body.on .links li{
    animation:slam .3s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes slam{
    0%{ opacity:0; transform:translateX(-60px) skewX(-8deg); }
    70%{ opacity:1; transform:translateX(6px); }
    100%{ opacity:1; transform:translateX(0); }
  }

  /* --- chromatic aberration: badly converged tube --- */
  .name{ position:relative; }
  .name::before,
  .name::after{
    content:'deadbeat0nline';
    position:absolute;
    inset:0;
    z-index:-1;
    line-height:inherit;
  }
  .name::before{
    color:rgba(255,0,60,0.55);
    transform:translate(-3px,0);
    animation:sliceA 3.1s steps(1) infinite;
    will-change:clip-path,transform;
  }
  .name::after{
    color:rgba(0,229,255,0.4);
    transform:translate(3px,1px);
    animation:sliceB 2.7s steps(1) infinite;
    will-change:clip-path,transform;
  }
  @keyframes sliceA{
    0%,100%{ clip-path:none; transform:translate(-3px,0); }
    88%{ clip-path:inset(15% 0 60% 0); transform:translate(-12px,2px); }
    91%{ clip-path:inset(65% 0 10% 0); transform:translate(9px,-2px); }
    94%{ clip-path:none; transform:translate(-3px,0); }
  }
  @keyframes sliceB{
    0%,100%{ clip-path:none; transform:translate(3px,1px); }
    84%{ clip-path:inset(40% 0 35% 0); transform:translate(11px,-1px); }
    87%{ clip-path:inset(5% 0 75% 0); transform:translate(-8px,3px); }
    90%{ clip-path:none; transform:translate(3px,1px); }
  }
  .links a span, .table-head span, a.nowplaying, .press-start{
    text-shadow:1px 0 rgba(255,0,0,0.35), -1px 0 rgba(0,229,255,0.25);
  }

  /* --- burn-in ghost: the cabinet ran this game for 20 years --- */
  .burnin{
    position:absolute;
    inset:0;
    font-size:inherit;
    line-height:inherit;
    color:rgba(190,255,190,0.05);
    transform:translate(7px,5px);
    pointer-events:none;
    user-select:none;
    z-index:-2;
  }

  /* --- links bleed on hover --- */
  .links a{ position:relative; }
  .links a::after{
    content:"";
    position:absolute;
    left:6%; right:6%; top:100%;
    height:16px;
    background:
      radial-gradient(4px 11px at 18% 0, #a80505 60%, transparent 61%),
      radial-gradient(3px 15px at 39% 0, #8a0000 60%, transparent 61%),
      radial-gradient(5px 9px  at 58% 0, #c40b0b 60%, transparent 61%),
      radial-gradient(3px 13px at 79% 0, #900000 60%, transparent 61%),
      radial-gradient(4px 7px  at 92% 0, #a80505 60%, transparent 61%);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .25s ease-out;
    pointer-events:none;
  }
  .links a:hover::after{ transform:scaleY(1); }

  /* --- blood pool rising at the bottom --- */
  .bloodpool{
    position:fixed;
    bottom:0; left:0; right:0;
    height:7vh;
    background:linear-gradient(to top, #5a0000, #300000 65%, transparent);
    z-index:6;
    pointer-events:none;
    transform:scaleY(0.12);
    transform-origin:bottom;
    animation:poolrise 240s linear forwards;
    will-change:transform;
  }
  @keyframes poolrise{ to{ transform:scaleY(1); } }

  /* --- VHS tracking bar rolling down --- */
  .track{
    position:fixed;
    top:0; left:0; right:0;
    height:26px;
    background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.05), rgba(255,255,255,0.10), rgba(255,255,255,0.05), transparent);
    z-index:10;
    pointer-events:none;
    animation:trackroll 9s linear infinite;
    will-change:transform;
  }
  @keyframes trackroll{
    0%{ transform:translateY(-30px); }
    100%{ transform:translateY(105vh); }
  }

  /* --- RGB glitch bands: whole screen tears for a frame every few seconds --- */
  .glitchbands{
    position:fixed;
    inset:-20px 0;
    background:repeating-linear-gradient(0deg,
      transparent 0 44px,
      rgba(255,0,60,0.10) 44px 47px,
      transparent 47px 88px,
      rgba(0,229,255,0.08) 88px 90px,
      transparent 90px 140px);
    opacity:0;
    z-index:12;
    pointer-events:none;
    animation:bands 5.3s steps(1) infinite;
    will-change:opacity,transform;
  }
  @keyframes bands{
    0%{ opacity:0; transform:translate(0,0); }
    57%{ opacity:0; }
    58%{ opacity:1; transform:translate(-9px,3px); }
    60%{ opacity:0; transform:translate(0,0); }
    86%{ opacity:0; }
    87%{ opacity:1; transform:translate(7px,-4px); }
    88%{ opacity:.5; transform:translate(-5px,0); }
    89%{ opacity:0; transform:translate(0,0); }
  }

  /* --- dead / stuck pixels --- */
  .deadpx span{
    position:fixed;
    width:2px; height:2px;
    z-index:11;
    pointer-events:none;
  }
  .deadpx span:nth-child(1){ top:18%; left:12%; background:#f00; }
  .deadpx span:nth-child(2){ top:63%; left:81%; background:#0f0; animation:blink 3s steps(1) infinite; }
  .deadpx span:nth-child(3){ top:41%; left:93%; background:#f00; }
  .deadpx span:nth-child(4){ top:87%; left:23%; background:#0ff; animation:blink 5s steps(1) infinite; }

  /* --- K.O. — the countdown hits zero and the machine takes the hit --- */
  body.ko{ animation:kofry .16s steps(1) infinite; }
  @keyframes kofry{
    0%{ filter:none; }
    25%{ filter:invert(1) hue-rotate(90deg); }
    45%{ filter:contrast(2) saturate(3) hue-rotate(-60deg); }
    65%{ filter:invert(.85) hue-rotate(180deg); }
    85%{ filter:contrast(1.5) brightness(1.4); }
    100%{ filter:none; }
  }
  body.ko .screen{ animation:koshake .12s steps(2) infinite; }
  @keyframes koshake{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-8px,4px) skewX(-2deg); }
    50%{ transform:translate(7px,-5px); }
    75%{ transform:translate(-4px,-3px) skewX(2deg); }
  }
  /* glitch bands go full-bore during the hit */
  body.ko .glitchbands{ animation:bandsko .1s steps(1) infinite; }
  @keyframes bandsko{
    0%{ opacity:1; transform:translate(-12px,4px); }
    50%{ opacity:.4; transform:translate(10px,-6px); }
    100%{ opacity:1; transform:translate(-6px,2px); }
  }
  .koflash{
    position:fixed; inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:40;
    background:rgba(90,0,0,0.45);
    font-family:'Nosifer',cursive;
    font-size:clamp(70px,22vw,180px);
    color:#e01212;
    text-shadow:4px 4px 0 #2a0000, 0 0 60px rgba(255,0,0,0.8);
    pointer-events:none;
  }
  body.ko .koflash{ display:flex; animation:kostrobe .14s steps(1) infinite; }

  /* phones: fill the screen, bigger everything */
  @media (max-width:480px){
    .screen{ padding-top:23vh; }
    .name{ font-size:clamp(24px,7.6vw,38px); }
    .table-head{ font-size:9px; }
    .links a{ font-size:13px; padding:17px 10px; }
    a.nowplaying{ font-size:10px; }
    .press-start{ font-size:9px; margin-top:20px; }
    .press-start .count{ font-size:15px; }
  }
  @keyframes kostrobe{
    0%{ background:rgba(90,0,0,0.5); transform:rotate(-5deg) translate(0,0); }
    30%{ background:rgba(0,0,0,0.75); transform:rotate(-4deg) translate(-14px,6px) scale(1.04); }
    60%{ background:rgba(120,0,0,0.35); transform:rotate(-6deg) translate(10px,-8px); }
    80%{ background:rgba(30,0,0,0.7); transform:rotate(-5deg) translate(-6px,3px) scale(0.98); }
    100%{ background:rgba(90,0,0,0.5); transform:rotate(-5deg) translate(0,0); }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="21" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="drips" aria-hidden="true">
  <span style="--x:4%;  --w:7px;  --h:90px; --d:0s"></span>
  <span style="--x:13%; --w:4px;  --h:70px;  --d:-2s"></span>
  <span style="--x:22%; --w:9px;  --h:110px; --d:-4s"></span>
  <span style="--x:31%; --w:5px;  --h:55px;  --d:-1s"></span>
  <span style="--x:43%; --w:6px;  --h:95px;  --d:-5s"></span>
  <span style="--x:55%; --w:10px; --h:125px; --d:-3s"></span>
  <span style="--x:64%; --w:4px;  --h:60px;  --d:-6s"></span>
  <span style="--x:72%; --w:7px;  --h:95px; --d:-2.5s"></span>
  <span style="--x:83%; --w:5px;  --h:85px;  --d:-4.5s"></span>
  <span style="--x:92%; --w:8px;  --h:105px; --d:-1.5s"></span>
</div>

<div class="boot" aria-hidden="true">
  <div class="term"><span id="typed"></span><span class="cursor"></span></div>
</div>

<div class="bloodpool" aria-hidden="true"></div>
<div class="track" aria-hidden="true"></div>
<div class="glitchbands" aria-hidden="true"></div>
<div class="deadpx" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="koflash" aria-hidden="true">K.O.</div>

<div class="screen">
  <!-- EDIT ME: your name -->
  <h1 class="name">deadbeat0nline<span class="burnin" aria-hidden="true">deadbeat0nline</span></h1>

  <div class="table-head">
    <span>RANK</span><span>DESTINATION</span><span>SCORE</span>
  </div>
  <ul class="links" id="links"></ul>

  <a class="nowplaying" id="nowplaying" href="#" target="_blank" rel="noopener noreferrer">...</a>

  <footer>&copy; 199X DEADBEAT CORP &mdash; LICENSED BY NO ONE</footer>
</div>

<script>
  // ============================================================
  // Content comes from config.json (edit it with admin.html).
  // The FALLBACK below is only used if config.json can't load
  // (e.g. opening this file directly from disk).
  // ============================================================
  const FALLBACK = {
    nowPlaying: { title: "YOUR NEWEST SONG", url: "https://open.spotify.com/artist/yourid" },
    links: [
      { label: "INSTAGRAM",  url: "https://instagram.com/yourhandle" },
      { label: "X/TWITTER",  url: "https://x.com/yourhandle" },
      { label: "TIKTOK",     url: "https://tiktok.com/@yourhandle" },
      { label: "SPOTIFY",    url: "https://open.spotify.com/artist/yourid" },
      { label: "BANDCAMP",   url: "https://yourname.bandcamp.com" },
      { label: "SOUNDCLOUD", url: "https://soundcloud.com/yourhandle" }
    ]
  };

  function ordinal(i){
    const n = i + 1;
    const suf = n === 1 ? 'ST' : n === 2 ? 'ND' : n === 3 ? 'RD' : 'TH';
    return n + suf;
  }

  function render(cfg){
    const ul = document.getElementById('links');
    ul.innerHTML = '';
    cfg.links.forEach((l, i) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      const score = (l.extra && /^\d+$/.test(l.extra)) ? l.extra : ((cfg.links.length - i) * 111111).toString().padStart(6,'0');
      a.innerHTML = `<span class="rank">${ordinal(i)}</span><span>${l.label.toUpperCase()}</span><span class="score">${score}</span>`;
      li.style.animationDelay = (0.15 + i * 0.13) + 's';
      li.appendChild(a);
      ul.appendChild(li);
    });
    const np = document.getElementById('nowplaying');
    if(cfg.nowPlaying && cfg.nowPlaying.title){
      np.href = cfg.nowPlaying.url || '#';
      np.textContent = cfg.nowPlaying.title.toUpperCase() + ' \u2014 OUT NOW';
    } else {
      np.style.display = 'none';
    }
  }

  fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => render(FALLBACK));

  // the machine still takes a hit every 10 seconds
  (function(){
    setInterval(() => {
      document.body.classList.add('ko');
      setTimeout(() => document.body.classList.remove('ko'), 700);
    }, 10000);
  })();

  // terminal boot: type the name, hold a beat, then the tube flashes to life
  (function(){
    const el = document.getElementById('typed');
    const word = 'deadbeat0nline';
    let i = 0;
    const t = setInterval(() => {
      el.textContent = word.slice(0, ++i);
      if(i >= word.length){
        clearInterval(t);
        setTimeout(() => document.body.classList.add('on'), 700);
      }
    }, 90);
  })();
</script>

</body>
