<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>deadbeat0nline</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{ --red:#ff2222; --gold:#ffcc00; --fg:#e8e8e8; }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#000; color:var(--fg);
    font-family:'Press Start 2P',monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #c{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; }

  /* CRT scanline glass over everything */
  .glass{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.26) 0 2px, transparent 2px 4px);
    mix-blend-mode:multiply;
  }

  /* ---------- the screen ---------- */
  .stage{
    position:fixed; inset:0; z-index:3;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px 14px;
    pointer-events:none;
    opacity:0; transition:opacity .5s ease .12s;
  }
  body.on .stage{ opacity:1; }

  .mark{
    font-family:'Nosifer',cursive;
    font-size:clamp(21px,6.6vw,46px);
    color:#e01212;
    line-height:1.15;
    transform:rotate(-2deg);
    margin:0 0 6px;
    text-shadow:
      2px 2px 0 #4a0000,
      4px 4px 0 #2a0000,
      0 0 30px rgba(255,20,20,0.8),
      0 0 76px rgba(255,0,0,0.4);
  }
  .np{
    font-size:clamp(9px,2.4vw,13px);
    color:var(--gold);
    letter-spacing:1px;
    text-decoration:none;
    pointer-events:auto;
    margin-bottom:26px;
    padding:8px 12px;
    border-top:2px solid rgba(180,0,0,.75);
    border-bottom:2px solid rgba(180,0,0,.75);
    text-shadow:0 0 12px rgba(255,215,0,.6);
    animation:blink 1.7s steps(1) infinite;
  }
  .np:hover{ color:#fff; animation:none; text-shadow:0 0 16px var(--gold); }
  @keyframes blink{ 50%{ opacity:.45; } }

  .objs{
    display:flex; flex-wrap:wrap; gap:10px 12px;
    align-items:center; justify-content:center;
    max-width:620px;
  }
  .obj{
    pointer-events:auto;
    position:relative;
    display:inline-block;
    padding:13px 17px;
    font-size:clamp(9px,2.3vw,12px);
    letter-spacing:1px;
    color:#f2dede;
    text-decoration:none;
    background:rgba(38,2,4,0.46);
    border:1px solid rgba(190,20,20,0.42);
    text-shadow:1px 0 rgba(255,0,0,0.45), -1px 0 rgba(0,229,255,0.28);
    backdrop-filter:blur(1.5px);
    -webkit-backdrop-filter:blur(1.5px);
    transition:color .12s, background .12s, border-color .12s;
    will-change:transform;
  }
  .obj::after{
    content:'';
    position:absolute; left:12%; right:12%; top:100%;
    height:9px;
    background:
      radial-gradient(60% 100% at 18% 0%, rgba(190,12,12,.85), transparent 70%),
      radial-gradient(45% 100% at 62% 0%, rgba(150,8,8,.7),  transparent 70%);
    filter:blur(.4px); opacity:.85; pointer-events:none;
  }
  .obj:hover, .obj:focus-visible{
    color:#fff;
    background:rgba(150,6,10,0.72);
    border-color:rgba(255,60,60,0.9);
    outline:none;
  }

  /* ---------- power-on boot: unchanged from the original cabinet ---------- */
  .boot{
    position:fixed; inset:0;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.35) 0 2px, transparent 2px 4px),
      #000;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    color:var(--fg);
    letter-spacing:1px;
  }
  .boot .term{
    font-family:'VT323',monospace;
    font-size:clamp(34px,9vw,58px);
    color:#ff2b3a;
    text-shadow:0 0 10px rgba(255,43,58,0.55), 0 0 40px rgba(255,20,40,0.25);
    letter-spacing:2px;
    display:flex;
    align-items:center;
  }
  .boot .cursor{
    display:inline-block;
    width:0.55em; height:1em;
    margin-left:6px;
    background:#ff2b3a;
    box-shadow:0 0 12px rgba(255,43,58,0.7);
    animation:blink 1s steps(1) infinite;
  }
  body.on .boot{ animation:crtflash .45s ease-out forwards; pointer-events:none; }
  @keyframes crtflash{
    0%{ opacity:1; background:#000; }
    15%{ background:#fff; opacity:1; transform:scaleY(1); }
    100%{ background:#fff; opacity:0; transform:scaleY(0.004); visibility:hidden; }
  }

  /* link slabs slam in once the tube lights up */
  body.on .obj{ animation:slam .3s cubic-bezier(.2,1.4,.4,1) backwards; }
  @keyframes slam{
    0%{ opacity:0; transform:translateX(-40px) skewX(-8deg); }
    70%{ opacity:1; transform:translateX(5px); }
    100%{ opacity:1; transform:translateX(0); }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="glass"></div>

<div class="stage">
  <h1 class="mark">deadbeat0nline</h1>
  <a class="np" id="nowplaying" href="#" target="_blank" rel="noopener noreferrer"></a>
  <div class="objs" id="objs"></div>
</div>

<div class="boot" aria-hidden="true">
  <div class="term"><span id="typed"></span><span class="cursor"></span></div>
</div>

<script src="viz-engine.js"></script>
<script src="envelope.js"></script>
<script>
  // ============================================================
  // Content comes from config.json (edit it with admin.html).
  // ============================================================
  const FALLBACK = {
    nowPlaying: { title: "", url: "" },
    links: [{ label: "SOUNDCLOUD", url: "https://soundcloud.com/deadbeatonline" }]
  };

  function render(cfg){
    const wrap = document.getElementById('objs');
    wrap.innerHTML = '';
    (cfg.links || []).forEach((l, i) => {
      const a = document.createElement('a');
      a.className = 'obj';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = (l.label || '').toUpperCase();
      a.dataset.seed = ((i * 137.5) % 100 / 100).toFixed(4);
      a.style.animationDelay = (0.05 + i * 0.09) + 's';
      wrap.appendChild(a);
    });
    const np = document.getElementById('nowplaying');
    if(cfg.nowPlaying && cfg.nowPlaying.title){
      np.href = cfg.nowPlaying.url || '#';
      np.textContent = cfg.nowPlaying.title.toUpperCase() + ' \u2014 OUT NOW';
    } else {
      np.style.display = 'none';
    }
  }

  fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(cfg => { render(cfg); initIntroSong(cfg); })
    .catch(() => render(FALLBACK));

  // ============================================================
  // INTRO SONG — untouched: plain <audio>, no Web Audio routing, so
  // it still starts the instant the link is clicked.
  // ============================================================
function initIntroSong(cfg){
    const is = cfg.introSong;
    if(!is || !is.enabled) return;

    // pick the active track from the library; fall back to the old
    // single-track config shape if that's all that's there
    let s = null;
    const lib = cfg.introSongLibrary;
    if(lib && lib.length){
      s = lib.find(t => t.id === is.activeId) || lib[0];
    } else if(is.url){
      s = is;
    }
    if(!s || !s.url) return;
    const startMs = Math.max(0, (parseFloat(s.startAt) || 0) * 1000);

    // ---- direct audio file (mp3/wav/ogg/m4a hosted on this site or
    // anywhere) — much faster than the SoundCloud widget: no iframe,
    // no API handshake, near-instant start and precise seeking ----
    if(/\.(mp3|wav|ogg|m4a|aac)(\?|#|$)/i.test(s.url)){
      const startSec = startMs / 1000;
      const a = new Audio(s.url);
      a.preload = 'auto';
      a.loop = true;                 // keep the visualiser alive
      window.__introAudio = a;       // let the visualiser read position
      window.__introTrackId = s.id || '';
      a.muted = true;
      let revealed = false;
      let seekTries = 0;
      const reveal = () => {
        if(revealed) return;
        revealed = true;
        a.muted = false;
        a.volume = 1;
      };
      // returns true once the playhead is actually AT the start point.
      // browsers silently clamp a currentTime set too early (before any
      // data is seekable), so we verify and re-issue the seek until it
      // sticks instead of trusting the first attempt.
      const inPosition = () => {
        if(startSec <= 0) return true;
        if(Math.abs(a.currentTime - startSec) <= 0.75) return true;
        if(seekTries < 8){
          seekTries++;
          try{ a.currentTime = startSec; }catch(e){}
        } else {
          return true; // give up gracefully rather than staying silent
        }
        return false;
      };
      a.addEventListener('loadedmetadata', inPosition);
      a.addEventListener('canplay', inPosition);
      a.addEventListener('seeked', () => { if(inPosition()) reveal(); });
      a.addEventListener('playing', () => { if(inPosition()) reveal(); });
      a.addEventListener('timeupdate', function tu(){
        if(inPosition()){ reveal(); a.removeEventListener('timeupdate', tu); }
      });
      const kick = () => {
        a.muted = false;
        if(a.paused){
          try{ a.currentTime = startSec; }catch(e){}
          a.play().catch(() => {});
        }
        revealed = true;
        removeEventListener('pointerdown', kick);
        removeEventListener('keydown', kick);
      };
      addEventListener('pointerdown', kick);
      addEventListener('keydown', kick);
      a.play().catch(() => { /* fully blocked — the tap listener above recovers */ });
      return;
    }

    // hidden SoundCloud player + widget API to control it
    const f = document.createElement('iframe');
    f.allow = 'autoplay';
    f.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0.01;pointer-events:none;left:-9999px;bottom:0;border:0;';
    f.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(s.url) +
            '&auto_play=false&visual=false&show_artwork=false&show_comments=false';
    document.body.appendChild(f);
    const api = document.createElement('script');
    api.src = 'https://w.soundcloud.com/player/api.js';
    api.onload = () => {
      const w = SC.Widget(f);
      let seeked = false;
      let playing = false;
      let seekConfirmed = false;
      let revealed = false;

      // The trick: seeking to a mid-song timestamp and hitting play at
      // that instant makes SoundCloud buffer that exact spot, which
      // takes a beat — audibly late if done right at the boot flash.
      // So instead we start it MUTED as early as possible, seek once
      // it's actually playing, and let it buffer/settle silently in
      // the background. By the time the flash happens, all we do is
      // turn the volume up — no seeking, no buffering, no lag.
      function reveal(){
        if(revealed) return;
        revealed = true;
        w.setVolume(100);
      }
      w.bind(SC.Widget.Events.READY, () => {
        w.setVolume(0);
        w.play();
      });
      w.bind(SC.Widget.Events.PLAY, () => {
        playing = true;
        if(!seeked){
          seeked = true;
          w.seekTo(startMs);
          // safety net: if the SEEK confirmation never fires for some
          // reason, don't leave the song muted forever
          setTimeout(reveal, 1200);
        }
      });
      // unmute the instant the seek to the start point settles — the song
      // kicks in as fast as it possibly can after the link is clicked,
      // while the boot screen is still typing
      w.bind(SC.Widget.Events.SEEK, () => {
        seekConfirmed = true;
        reveal();
      });

      // browsers sometimes block autoplay entirely (even muted) until a
      // real tap/click — this recovers audio in that case
      const kick = () => {
        w.isPaused(paused => {
          if(paused){ w.setVolume(100); w.play(); reveal(); }
          else { reveal(); }
        });
        removeEventListener('pointerdown', kick);
        removeEventListener('keydown', kick);
      };
      addEventListener('pointerdown', kick);
      addEventListener('keydown', kick);
    };
    document.head.appendChild(api);
  }

  // ============================================================
  // VISUALISER — driven off the intro song's playback position using a
  // pre-baked FFT envelope. That keeps it locked to the track without
  // an AnalyserNode (which needs a user gesture and would mute the intro).
  // ============================================================
  (function(){
    const canvas = document.getElementById('c');
    let viz = null;
    try { viz = DBVIZ.Viz({ canvas: canvas, scale: 0.58 }); }
    catch(e){ return; }   // no webgl: page still works, just no meat

    let env = null, envData = null;
    function envFor(id){
      const e = window.DBENV && window.DBENV[id];
      if(!e) return null;
      if(!e._u8){
        const bin = atob(e.b64);
        const u8 = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        e._u8 = u8;
      }
      return e;
    }

    const t0 = performance.now();
    const A = { bass:0, mid:0, treb:0, level:0, beat:0, warpKick:0 };

    function frame(){
      const now = (performance.now() - t0) / 1000;
      const audio = window.__introAudio;

      if(!env && window.__introTrackId) env = envFor(window.__introTrackId);

      if(env && audio && !audio.paused){
        const i = Math.min(env.n - 1, Math.max(0, Math.floor(audio.currentTime * env.fps)));
        const o = i * env.ch, d = env._u8;
        A.bass = d[o] / 255; A.mid = d[o+1] / 255; A.treb = d[o+2] / 255;
        A.level = d[o+3] / 255; A.beat = d[o+4] / 255;
        A.warpKick = A.beat > 0.62 ? A.beat : 0;
      } else {
        // no baked envelope for this track (or not playing yet) — keep the
        // tissue breathing so it never looks frozen
        const b = 0.30 + 0.22 * Math.sin(now * 1.9) + 0.10 * Math.sin(now * 0.7);
        A.bass = b; A.mid = 0.22 + 0.12 * Math.sin(now * 1.3);
        A.treb = 0.16 + 0.10 * Math.sin(now * 2.7);
        A.level = 0.30; A.beat *= 0.90; A.warpKick = 0;
      }

      viz.draw(now, A);

      const k = viz.state.beat;
      const objs = document.getElementById('objs').children;
      for(let i = 0; i < objs.length; i++){
        const el = objs[i];
        const s = parseFloat(el.dataset.seed || 0) * 10;
        const dx = Math.sin(now * 0.42 + s) * 4.5 + k * Math.sin(s * 7.0) * 5.0;
        const dy = Math.cos(now * 0.35 + s * 1.4) * 3.5 + k * Math.cos(s * 5.0) * 4.0;
        el.style.transform = 'translate(' + dx.toFixed(2) + 'px,' + dy.toFixed(2) + 'px) scale(' + (1 + k * 0.035).toFixed(3) + ')';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  // ============================================================
  // terminal boot: type the name, hold a beat, then the tube flashes.
  // ~2s total, matched to the drop.
  // ============================================================
  (function(){
    const el = document.getElementById('typed');
    const word = 'deadbeat0nline';
    let i = 0;
    setTimeout(() => {
      const t = setInterval(() => {
        el.textContent = word.slice(0, ++i);
        if(i >= word.length){
          clearInterval(t);
          setTimeout(() => {
            document.body.classList.add('on');
            window.__bootFlashed = true;
            document.dispatchEvent(new Event('siteboot'));
          }, 450);
        }
      }, 100);
    }, 150);
  })();
</script>

</body>
</html>
